<div class="container mt-5 text-center">

  <h3 class="mb-3">Identity Verification</h3>

  <p><strong>User:</strong> {{userName}}</p>
  <p><strong>Course:</strong> {{courseName}}</p>

  <!-- Camera -->
   <video #videoElement autoplay muted playsinline width="300" *ngIf="!isFaceCaptured"></video>

   <div *ngIf="isFaceCaptured">
  <p class="text-success">✅ Face Captured</p>
</div>

  <!-- Buttons -->
  <div class="mt-3">
    <button class="btn btn-primary me-2" (click)="captureFace()">Capture</button>
    <button class="btn btn-warning me-2" (click)="retake()">Retake</button>
    <button class="btn btn-success" [disabled]="!isFaceCaptured" (click)="startExam()">
      Start Exam
    </button>
  </div>

</div>
